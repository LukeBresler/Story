<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>37 Elephants</title>
  <meta name="description" content="Watch over a herd of 37 elephants in Amboseli, Kenya, in real time." />
  <meta name="theme-color" content="#1b1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="37 Elephants" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene" aria-label="The herd on the Amboseli plains"></canvas>

    <!-- In-game HUD -->
    <div id="hud" class="hidden">
      <header class="hud-top">
        <button id="herdPill" class="pill glass" aria-label="Your herd">
          <span class="ico" data-icon="elephant"></span><b id="herdCount">37</b><span id="herdMax">/37</span>
        </button>
        <div class="clock glass">
          <span id="weatherIcon" class="ico"></span>
          <div><div><span id="clockTime">--:--</span><span id="clockTemp"></span></div><div id="clockSub">Amboseli</div></div>
        </div>
        <div class="hud-right">
          <button id="journalBtn" class="icon-btn glass" aria-label="Journal"><span class="ico" data-icon="book"></span></button>
          <button id="menuBtn" class="icon-btn glass" aria-label="Menu"><span class="ico" data-icon="menu"></span></button>
        </div>
      </header>

      <div class="meters glass">
        <div class="meter" id="mWater"><span class="ico" data-icon="water"></span><div class="track"><i></i></div></div>
        <div class="meter" id="mForage"><span class="ico" data-icon="grass"></span><div class="track"><i></i></div></div>
        <div class="meter" id="mMood"><span class="ico" data-icon="heart"></span><div class="track"><i></i></div></div>
      </div>

      <div id="alerts"></div>

      <div id="selCard" class="sel-card glass hidden">
        <img id="selImg" alt="" />
        <div class="sel-info">
          <b id="selName"></b>
          <span id="selMeta"></span>
          <div class="sel-bars"><div class="bar h"><i id="selHealth"></i></div><div class="bar j"><i id="selHappy"></i></div></div>
          <div id="selActions" class="sel-actions"></div>
        </div>
        <button id="selClose" class="x" aria-label="Close"><span class="ico" data-icon="close"></span></button>
      </div>

      <div id="whisper" class="whisper"></div>

      <nav class="dock glass">
        <button id="btnWater"><span class="ico" data-icon="water"></span><small>Water</small></button>
        <button id="btnGraze"><span class="ico" data-icon="grass"></span><small>Graze</small></button>
        <button id="btnGather"><span class="ico" data-icon="gather"></span><small>Gather</small></button>
        <button id="btnRangers"><span class="ico" data-icon="shield"></span><small>Rangers</small></button>
        <button id="btnHerd"><span class="ico" data-icon="herd"></span><small>Herd</small></button>
      </nav>
    </div>

    <div id="toasts"></div>

    <!-- Title -->
    <section id="title" class="screen">
      <div class="title-wrap">
        <div class="logo" role="img" aria-label="37 Elephants">
          <span class="num">37</span>
          <span class="word">Elephants</span>
        </div>
        <p class="title-live"></p>
        <div class="title-panel glass">
          <div class="journeys"></div>
          <div class="title-actions"></div>
        </div>
        <button id="titleDev" class="link hidden">Dev mode</button>
      </div>
    </section>

    <section id="intro" class="screen hidden"><div class="intro-card glass"></div></section>
    <section id="over" class="screen hidden"><div class="over-card glass"></div></section>

    <div id="moment" class="moment hidden"></div>

    <div id="sheet" class="sheet hidden">
      <div class="sheet-panel glass">
        <div class="sheet-head"><h3 id="sheetTitle"></h3><button id="sheetClose" class="x" aria-label="Close"><span class="ico" data-icon="close"></span></button></div>
        <div id="sheetBody"></div>
      </div>
    </div>
  </div>
  <noscript>37 Elephants needs JavaScript to run.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
